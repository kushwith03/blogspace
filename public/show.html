<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container py-4">
    <div class="main-content">
        <div id="blog-content" class="card shadow-sm mx-auto" style="max-width: 800px;">
            <div class="card-body text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading blog details...</p>
            </div>
        </div>
    </div>

    <footer class="mt-5 pt-3 border-top text-center text-muted">
        <p>&copy; 2025 BlogSpace - Built by Kushwith</p>
    </footer>

    <script type="module">
        import API_BASE_URL from './js/config.js';

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadBlog() {
            if (!id) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/blogs/${id}`);
                const blog = await res.json();

                if (blog.error) throw new Error(blog.error);

                document.getElementById('blog-content').innerHTML = `
                    <div class="card-body">
                        <h1 class="card-title h2">${blog.title}</h1>
                        <p class="text-muted mb-4">
                            <strong>By:</strong> ${blog.author} | 
                            <strong>Date:</strong> ${new Date(blog.date).toLocaleDateString()}
                        </p>
                        <hr>
                        <div class="card-text mb-5" style="white-space: pre-wrap;">${blog.content}</div>
                        
                        <div class="d-flex gap-2">
                            <a href="index.html" class="btn btn-outline-secondary">Back to List</a>
                            <a href="edit.html?id=${blog.id}" class="btn btn-secondary">Edit Blog</a>
                            <a href="delete.html?id=${blog.id}" class="btn btn-danger">Delete</a>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Fetch Error:', err);
                document.getElementById('blog-content').innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
        }

        loadBlog();
    </script>
</body>
</html>
