<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details - BlogSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./">BlogSpace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="./">Home</a>
                    </li>
                    <li id="auth-links" class="d-flex align-items-center"></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content container">
        <div id="blog-content" class="card shadow-sm mx-auto" style="max-width: 800px;">
            <div class="card-body text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading blog details...</p>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-4 border-top text-center text-muted">
        <div class="container">
            <p class="mb-0">&copy; <span id="year"></span> BlogSpace - Built with ❤️ by Kushwith_03</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API_BASE_URL from './js/config.js';

        document.getElementById('year').textContent = new Date().getFullYear();

        const token = localStorage.getItem('blog_token');
        const authLinks = document.getElementById('auth-links');
        if (token) {
            authLinks.innerHTML = `
                <li class="nav-item ms-lg-3">
                    <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
                </li>
            `;
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('blog_token');
                window.location.href = './';
            });
        } else {
            authLinks.innerHTML = `
                <li class="nav-item ms-lg-3"><a class="nav-link" href="./login">Login</a></li>
                <li class="nav-item ms-lg-2"><a class="btn btn-sm btn-primary" href="./register">Register</a></li>
            `;
        }

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadBlog() {
            if (!id) {
                window.location.href = './';
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/blogs/${id}`);
                const blog = await res.json();
                if (blog.error) throw new Error(blog.error);

                document.getElementById('blog-content').innerHTML = `
                    <div class="card-body p-4 p-md-5">
                        <h1 class="card-title h2 mb-3">${blog.title}</h1>
                        <p class="text-secondary mb-4">
                            <strong>By:</strong> ${blog.author} | 
                            <strong>Date:</strong> ${new Date(blog.date).toLocaleDateString()}
                        </p>
                        <hr class="mb-4">
                        <div class="card-text mb-5 lh-lg" style="white-space: pre-wrap; font-size: 1.1rem;">${blog.content}</div>
                        
                        <div class="d-flex flex-wrap gap-2 pt-4 border-top">
                            <a href="./" class="btn btn-outline-secondary">Back to List</a>
                            <a href="./edit?id=${blog.id}" class="btn btn-outline-primary">Edit Blog</a>
                            <a href="./delete?id=${blog.id}" class="btn btn-outline-danger">Delete</a>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Fetch Error:', err);
                document.getElementById('blog-content').innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
        }

        loadBlog();
    </script>
</body>
</html>
