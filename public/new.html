<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Blog - BlogSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./">BlogSpace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="./">Home</a>
                    </li>
                    <li id="auth-links" class="d-flex align-items-center"></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content container">
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title mb-4">Write a New Story</h2>
                <form id="create-form">
                    <div class="mb-3">
                        <label for="title" class="form-label font-weight-bold">Title</label>
                        <input type="text" class="form-control" id="title" required placeholder="Give your story a title">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label">Display Name</label>
                        <input type="text" class="form-control" id="author" required placeholder="Who is writing this?">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Content</label>
                        <textarea class="form-control" id="content" rows="10" required placeholder="What's on your mind?"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted">Post Password</label>
                        <input type="password" class="form-control" id="password" required placeholder="Needed for future edits/deletion">
                    </div>
                    <div class="d-flex gap-2 pt-3 border-top">
                        <button type="submit" id="submit-btn" class="btn btn-success px-4">Publish Story</button>
                        <a href="./" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-4 border-top text-center text-muted">
        <div class="container">
            <p class="mb-0">&copy; <span id="year"></span> BlogSpace - Built with ❤️ by Kushwith_03</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API_BASE_URL from './js/config.js';
        document.getElementById('year').textContent = new Date().getFullYear();

        const token = localStorage.getItem('blog_token');
        const authLinks = document.getElementById('auth-links');
        if (token) {
            authLinks.innerHTML = `
                <li class="nav-item ms-lg-3">
                    <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
                </li>
            `;
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('blog_token');
                window.location.href = './';
            });
        } else {
            authLinks.innerHTML = `
                <li class="nav-item ms-lg-3"><a class="nav-link" href="./login">Login</a></li>
                <li class="nav-item ms-lg-2"><a class="btn btn-sm btn-primary" href="./register">Register</a></li>
            `;
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'Publishing...';

            const data = {
                title: document.getElementById('title').value.trim(),
                author: document.getElementById('author').value.trim(),
                content: document.getElementById('content').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/blogs`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                if (res.status === 401) {
                    alert('You must be logged in to publish a story.');
                    window.location.href = './login';
                    return;
                }
                
                const result = await res.json();
                if (result.error) throw new Error(result.error);
                window.location.href = './';
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerText = 'Publish Story';
            }
        });
    </script>
</body>
</html>
