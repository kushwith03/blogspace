<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BlogSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./">BlogSpace</a>
        </div>
    </nav>

    <div class="main-content container d-flex align-items-center justify-content-center">
        <div class="card shadow-sm w-100" style="max-width: 400px;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4">Create Account</h2>
                <form id="register-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required placeholder="Choose a username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required placeholder="Create a password">
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 mb-3">Register</button>
                </form>
                <div class="text-center small">
                    <p class="text-muted mb-1">Already have an account? <a href="login.html">Login here</a></p>
                    <a href="index.html" class="text-secondary">Back to Home</a>
                </div>
                <div id="message" class="mt-3"></div>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-4 border-top text-center text-muted">
        <div class="container">
            <p class="mb-0">&copy; <span id="year"></span> BlogSpace - Built by Kushwith</p>
        </div>
    </footer>

    <script type="module">
        import API_BASE_URL from './js/config.js';
        document.getElementById('year').textContent = new Date().getFullYear();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const res = await fetch(`${API_BASE_URL.replace('/blogs', '')}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    messageDiv.innerHTML = '<div class="alert alert-success py-2">Account created! Redirecting...</div>';
                    setTimeout(() => window.location.href = 'login.html', 1000);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger py-2">${data.error || 'Registration failed'}</div>`;
                }
            } catch (err) {
                console.error(err);
                messageDiv.innerHTML = '<div class="alert alert-danger py-2">Error connecting to server</div>';
            }
        });
    </script>
</body>
</html>
