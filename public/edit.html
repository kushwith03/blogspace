<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="container py-4">
    <div class="main-content">
        <div id="edit-container" class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading blog details...</p>
            </div>
        </div>
    </div>

    <footer class="mt-5 pt-3 border-top text-center text-muted">
        <p>&copy; 2025 BlogSpace - Built by Kushwith</p>
    </footer>

    <script type="module">
        import API_BASE_URL from '/js/config.js';

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadBlog() {
            if (!id) {
                window.location.href = '/index.html';
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/blogs/${id}`);
                const blog = await res.json();
                if (blog.error) throw new Error(blog.error);

                document.getElementById('edit-container').innerHTML = `
                    <div class="card-body">
                        <h2 class="card-title mb-4">Edit Blog</h2>
                        <form id="edit-form">
                            <div class="mb-3">
                                <label class="form-label">Author</label>
                                <input type="text" class="form-control" value="${blog.author}" disabled>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">New Content</label>
                                <textarea class="form-control" id="content" rows="8" required>${blog.content}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter secret password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" id="submit-btn" class="btn btn-primary">Update Blog</button>
                                <a href="show.html?id=${blog.id}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                `;

                document.getElementById('edit-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('submit-btn');
                    btn.disabled = true;
                    btn.innerText = 'Updating...';

                    const data = {
                        content: document.getElementById('content').value,
                        password: document.getElementById('password').value
                    };

                    try {
                        const res = await fetch(`${API_BASE_URL}/blogs/${id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        const result = await res.json();
                        if (result.error) throw new Error(result.error);
                        window.location.href = `/show.html?id=${id}`;
                    } catch (err) {
                        alert(err.message);
                        btn.disabled = false;
                        btn.innerText = 'Update Blog';
                    }
                });

            } catch (err) {
                document.getElementById('edit-container').innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
        }

        loadBlog();
    </script>
</body>
</html>
