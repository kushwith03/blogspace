<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./">BlogSpace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link active" href="./">Home</a>
                    </li>
                    <li id="auth-links" class="d-flex align-items-center">
                        <!-- Auth links will be injected here -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Latest Stories</h1>
            <a href="./new" id="create-btn" class="btn btn-success d-none">Create Blog</a>
        </div>

        <div id="blogs-container" class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading blogs...</p>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-4 border-top text-center text-muted">
        <div class="container">
            <p class="mb-0">&copy; <span id="year"></span> BlogSpace - Built by Kushwith</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API_BASE_URL from './js/config.js';

        document.getElementById('year').textContent = new Date().getFullYear();

        // Auth state management
        const token = localStorage.getItem('blog_token');
        const authLinks = document.getElementById('auth-links');
        const createBtn = document.getElementById('create-btn');

        if (token) {
            createBtn.classList.remove('d-none');
            authLinks.innerHTML = `
                <li class="nav-item ms-lg-3">
                    <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
                </li>
            `;
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('blog_token');
                window.location.reload();
            });
        } else {
            authLinks.innerHTML = `
                <li class="nav-item ms-lg-3">
                    <a class="nav-link" href="./login">Login</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-sm btn-primary" href="./register">Register</a>
                </li>
            `;
        }

        async function loadBlogs() {
            try {
                const res = await fetch(`${API_BASE_URL}/blogs`);
                const blogs = await res.json();
                const container = document.getElementById('blogs-container');
                
                if (!blogs || blogs.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <h3 class="text-muted">No blogs found yet</h3>
                            <p class="mb-4">Be the first one to share your thoughts with the world!</p>
                            <a href="new" class="btn btn-primary">Write Your First Blog</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = blogs.map(blog => `
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${blog.title}</h5>
                                <p class="card-text blog-card-text">
                                    ${blog.content}
                                </p>
                                <p class="small text-secondary mb-0">~ ${blog.author}</p>
                            </div>
                            <div class="card-footer bg-transparent border-top-0 pb-3">
                                <a href="./show?id=${blog.id}" class="btn btn-sm btn-outline-primary">Read More</a>
                                <a href="./edit?id=${blog.id}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                <a href="./delete?id=${blog.id}" class="btn btn-sm btn-outline-danger">Delete</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Fetch Error:', err);
                document.getElementById('blogs-container').innerHTML = '<div class="alert alert-danger">Error loading blogs. Please check if the API is running.</div>';
            }
        }

        loadBlogs();
    </script>
</body>
</html>
